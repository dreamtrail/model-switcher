# Model Switcher Configuration
# Each key is a model name used in API requests.
# Each value is a startup command string, or a mapping with cmd and optional
# shutdown_cmd / shutdown_timeout. Existing string entries remain supported.
#
# The switcher always auto-assigns a free port for each model.
# Port rewriting works in three ways:
#
#   1. ${PORT} placeholder — substituted directly (recommended)
#   2. --port flag in command — replaced with auto-assigned port
#   3. Script files — copied to temp dir, port flags rewritten inside
#
# If no port flag is found, --port <N> is appended automatically.

# --- Mode 1: ${PORT} placeholder (recommended) ---
# Switcher finds a free port and substitutes it directly.
llama-3.1-8b: "llama-server --model /path/to/llama-3.1-8b.gguf --port ${PORT} --ctx-size 8192"

# --- ninfer: use the artifact's exact embedded model ID ---
# ninfer runs in the foreground and reports ready on /health after warm-up.
qwen3.8-27b: "/path/to/ninfer/build/apps/ninfer-serve /path/to/models/qwen3_8_27b_nvfp4.ninfer --host 127.0.0.1 --port ${PORT}"

# --- SGLang: match the config key to --served-model-name ---
# sglang runs in the foreground; /health reports ready after warm-up.
qwen2.5-7b-sglang: "sglang serve --model-path /path/to/Qwen2.5-7B-Instruct --served-model-name qwen2.5-7b-sglang --host 127.0.0.1 --port ${PORT}"

# --- FreeToken v0.1.3: match the config key to --served-model-name ---
# FreeToken uses the selected port and the adjacent port while running.
freetoken-model: "ft serve --model /path/to/model --served-model-name freetoken-model --host 127.0.0.1 --port ${PORT}"

# --- Mode 2: Natural command (port flag replaced) ---
# Switcher auto-assigns a free port and replaces --port 8000 with it.
mistral-7b: "llama-server --model /path/to/mistral-7b.gguf --port 8000 --ctx-size 4096"

# --- Mode 3: Script file (copied and rewritten) ---
# Switcher copies the script to a temp dir, replaces port flags inside,
# and runs the temp copy. Original script is untouched.
# (Script must be first token of the command for detection to work.)
gemma-7b: "./start-gemma.sh"

# --- Mode 4: Non-standard port flags ---
# --listen-port is also recognized and replaced.
# If your server uses other flags, the switcher appends --port <N>
# (the server should accept the last --port or --listen-port flag).
phi-3: "llama-server --model /path/to/phi-3.gguf --listen-port 8000"

# --- Mode 5: Script with extra args ---
# Args after the script path are preserved.
my-model: "./start-model.sh --ctx 8192 --threads 4"

# --- Optional shutdown hook (user supplies the executable) ---
# Runs locally BEFORE local launcher termination on every managed stop path.
# No shell/placeholder expansion or port rewriting; stdin is disconnected.
# Must be scoped, idempotent, noninteractive, and wait for workers to stop.
# Exit zero confirms success (already stopped is success); failure blocks swaps.
# Timeout must be positive and finite, and requires shutdown_cmd; default is 30s.
# Hook timeout adds to process cleanup/service stop budgets: see docs/SETUP.md.
# hooked-model:
#   cmd: "my-model-server --port ${PORT}"
#   shutdown_cmd: "/path/to/stop-my-model --model hooked-model"
#   shutdown_timeout: 30
